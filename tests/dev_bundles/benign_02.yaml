apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa2
  namespace: dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: r0
  labels:
    rbac.example/aggregate: "true"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: r1
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.example/aggregate: "true"
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bind2
  namespace: dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: r1
subjects:
  - kind: ServiceAccount
    name: sa2
    namespace: dev
